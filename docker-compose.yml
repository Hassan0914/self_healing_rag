version: '3.8'

services:
  self-healing-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: self_healing_rag_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
